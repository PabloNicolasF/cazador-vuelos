name: ✈️ Cazador de Vuelos (EZE/AEP a EEUU y Europa)

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos las 24 hs
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_summary:
        description: '¿Forzar envío a Telegram aunque no haya tarifa error?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  escanear-vuelos:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar librerías
        run: pip install -r requirements.txt

      - name: 🔍 Buscar Tarifas Error y Vuelos Baratos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SUMMARY: ${{ github.event.inputs.force_summary || 'false' }}
        run: python cazador_vuelos.py

      - name: 💾 Guardar historial de alertas vistas (para no repetir alertas)
        run: |
          if [ -f seen_alerts.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_alerts.json
            git diff --staged --quiet || git commit -m "chore: actualizar historial de alertas vistas [skip ci]"
            git push
          fi
